[package]
name = "moddev-generator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
# dx rejects a wasm-bindgen-cli whose version differs from this crate, and the one
# shipped with devenv's dioxus-cli is 0.2.127.
wasm-bindgen = "=0.2.127"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
unwrap_in_result = "deny"
exit = "deny"
print_stdout = "warn"
read_zero_byte_vec = "deny"
